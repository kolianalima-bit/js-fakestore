<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>fackstore</title>

</head>

<body>

    <header class="flex items-center justify-between px-15 py-4 bg-orange-500">
        <div>
            <input onkeyup="pesquisarProdutos(event.target.value)" type="text" placeholder="Digite o nome do produto"  class="w-120 h-10 rounded bg-white pl-4" />
        </div>
        <div>
            <select id="categoria" onchange="filtrarProdutos(event.target.value)" class="h-10 rounded bg-white pl-4"> 
                <option selected disabled>Filtrar produtos</option>
                <option>All</option>
                <option>men's clothing</option>
                <option>women's clothing</option>
                <option>electronics</option>
                <option>jewelery</option>
            </select>
            <select id="ordenacao" onchange="ordenarProdutos(event.target.value)"  class="h-10 rounded bg-white pl-4"> class= 
                <option value="preco">Ordenar por Preço </option>
                <option value="nota">Informar por avaliação </option>
            </select>

        </div>
    </header>

    <main class="p-15 bg">
        <div id="cards" class="grid grid-cols-4 gap-4"></div>
    </main>
    <script src="index.js"></script>
</body>

</html>
